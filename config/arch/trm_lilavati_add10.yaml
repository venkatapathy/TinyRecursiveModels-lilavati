name: recursive_reasoning.trm_lilavati@TRM_Lilavati
loss:
  name: losses_lilavati@ACTLossHeadLilavati
  loss_type: stablemax_cross_entropy
  carry_loss_weight: 0.1

# Optimized for 10-digit (result up to 11 digits)
num_columns: 12  # 11 digits + 1 margin
bead_dim: 64
abacus_layers: 4
kernel_size: 3

# Halting config
halt_exploration_prob: 0.05
halt_max_steps: 16  # Match vanilla TRM config for 10-digit

# Standard transformer config
hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: 0  # Lilavati doesn't use puzzle embeddings
puzzle_emb_len: 0

pos_encodings: rope
forward_dtype: bfloat16

no_ACT_continue: True
