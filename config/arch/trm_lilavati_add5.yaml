name: recursive_reasoning.trm_lilavati@TRM_Lilavati
loss:
  name: losses_lilavati@ACTLossHeadLilavati
  loss_type: stablemax_cross_entropy
  carry_loss_weight: 0.5  # Increased from 0.1 to force proper carry reasoning
  digit_loss_weight: 0.5  # Increased from 0.1 to force proper digit-by-digit reasoning

# SthanaYantra config optimized for 5-digit (result up to 6 digits)
num_stambha: 8        # 6 digits + 2 margin (स्तम्भ)
gulika_dim: 64        # Bead dimension (गुलिका)
stambha_layers: 4     # Number of column processing layers
kernel_size: 3

# Halting config
halt_exploration_prob: 0.05
halt_max_steps: 12    # Match vanilla TRM config for 5-digit

# Standard transformer config
hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: 0  # Lilavati doesn't use puzzle embeddings
puzzle_emb_len: 0

pos_encodings: rope
forward_dtype: bfloat16

no_ACT_continue: True
