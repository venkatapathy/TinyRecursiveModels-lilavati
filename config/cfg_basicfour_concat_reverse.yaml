defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path (BasicFour Concat Reverse dataset)
data_paths: ['data/icml/reverse']
data_paths_test: ['data/icml/reverse']

# We disable specific evaluators for now as they might expect specific metadata
evaluators:
  - name: basicfour@BasicFourEvaluator

# Dataset mode
dataset_mode: "basic_concat_reverse"
digits: 32 # Upper bound for safety
train_digits: 8

# Hyperparams - Training
global_batch_size: 256

epochs: 50
eval_interval: 5
checkpoint_every_eval: False

lr: 1e-4
lr_min_ratio: 0.01
lr_warmup_steps: 100
grad_clip: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.0

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 0.0

seed: 42
min_eval_interval: 0
max_len: 256  # Increased length for sequential carry

project_name: "trm-arthmetic-icml"
run_name: "basicfour_concat_reverse"

arch:
  carry_loss_weight: 1.0 # Not used in single head, but good to keep
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0
