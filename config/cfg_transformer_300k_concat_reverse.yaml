# Config for 300k Parameter Standard Transformer Baseline - Concat Reverse
defaults:
  - arch: transformer_300k
  - _self_

# Hydra setup
hydra:
  output_subdir: null

# Project info
project_name: trm-arthmetic-icml
run_name: baseline_transformer_300k_concat_reverse

# Data Path (Matched to TRM concat_reverse)
data_paths: ['data/icml/reverse']
data_paths_test: ['data/icml/reverse']

# Evaluators
evaluators:
  - name: basicfour@BasicFourEvaluator

# Dataset mode
dataset_mode: "basic_concat_reverse"
digits: 32
train_digits: 8

# Hyperparams - Training (Matched to cfg_basicfour_concat_reverse.yaml)
global_batch_size: 256

epochs: 50
eval_interval: 5
checkpoint_every_eval: False

lr: 1e-4
lr_min_ratio: 0.01
lr_warmup_steps: 100
grad_clip: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 0.1

# Puzzle Embedding (None)
puzzle_emb_lr: 0.0
puzzle_emb_weight_decay: 0.0

# Arch Override
arch:
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0
  carry_loss_weight: 1.0
