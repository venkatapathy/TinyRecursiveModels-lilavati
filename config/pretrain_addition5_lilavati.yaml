defaults:
  - arch: trm_lilavati_add5
  - _self_

hydra:
  output_subdir: null

# Data path (using Lilavati format with carry supervision)
data_paths: ['data/addition5_lilavati']
data_paths_test: ['data/addition5_lilavati']

evaluators:
  - name: lilavati@LilavatiEvaluator

# Hyperparams - Training
global_batch_size: 256

epochs: 300
eval_interval: 3
checkpoint_every_eval: False

lr: 1e-4
lr_min_ratio: 0.01
lr_warmup_steps: 100
grad_clip: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.0

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 0.0

seed: 42
min_eval_interval: 0

project_name: "Addition5-Lilavati"
run_name: "lilavati-add5-v1"
