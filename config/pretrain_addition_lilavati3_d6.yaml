defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path (lilavati3 uses same data format as lilavati1/lilavati2)
data_paths: ['data/addition6_lilavati1_strict_mixed_fixed']
data_paths_test: ['data/addition6_lilavati1_strict_mixed_fixed']

evaluators:
  - name: addition@AdditionEvaluator

# Dataset mode
dataset_mode: "lilavati3"
digits: 6

# Hyperparams - Training
global_batch_size: 256

epochs: 100
eval_interval: 1
checkpoint_every_eval: False

lr: 1e-4
lr_min_ratio: 0.01
lr_warmup_steps: 100
grad_clip: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.0

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 0.0

seed: 42
min_eval_interval: 0

project_name: "trm-lilavati"
run_name: "lilavati3_trm_d6"

# Lilavati3 specific: carry probe loss weight (auxiliary, λ=0.05)
arch:
  carry_loss_weight: 1
