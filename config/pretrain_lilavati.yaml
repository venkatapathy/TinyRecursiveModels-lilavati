defaults:
  - arch: trm_lilavati
  - _self_

hydra:
  output_subdir: null

# Data path
data_paths: ['data/lilavati']
data_paths_test: ['data/lilavati']

evaluators:
  - name: lilavati@LilavatiEvaluator

# Hyperparams - Training
global_batch_size: 256

epochs: 500
eval_interval: 25
checkpoint_every_eval: False

lr: 1e-4
lr_min_ratio: 0.01
lr_warmup_steps: 100
grad_clip: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.0

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 0.0

seed: 42
min_eval_interval: 0

project_name: "Addition25-Lilavati"
run_name: "lilavati-v1"
