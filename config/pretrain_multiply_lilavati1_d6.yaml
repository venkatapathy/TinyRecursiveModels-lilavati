defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path
data_paths: ['data/multiplication6_lilavati1']
data_paths_test: ['data/multiplication6_lilavati1']

evaluators:
  - name: multiplication@MultiplicationEvaluator

# Dataset mode
dataset_mode: "lilavati1"
digits: 6

# Hyperparams - Training
global_batch_size: 256

epochs: 100
eval_interval: 1
checkpoint_every_eval: False

lr: 1e-4
lr_min_ratio: 0.01
lr_warmup_steps: 100
grad_clip: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.0

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 0.0

seed: 42
min_eval_interval: 0

project_name: "trm-lilavati-multiply"
run_name: "lilavati1_trm_d6"

# Lilavati1 specific: carry loss weight (lambda hyperparameter)
arch:
  carry_loss_weight: 0.5
  carry_loss_weight_schedule:
    enabled: false
    warmup_steps: 1000  # Keep full weight for first 1000 steps
    decay_start_ratio: 0.2  # Start decay at 20% of training (after warmup)
    min_ratio: 0.5  # Decay to 50% of original weight by end
