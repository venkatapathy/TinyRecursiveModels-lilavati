defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null

# Data path (lilavati2_fact_only uses same data format as lilavati1_fact_only)
data_paths: ['data/multiplication3_lilavati1_fact_only']
data_paths_test: ['data/multiplication3_lilavati1_fact_only']

evaluators:
  - name: multiplication@MultiplicationEvaluator

# Dataset mode
dataset_mode: "lilavati2_fact_only"
digits: 3

# Hyperparams - Training
global_batch_size: 256

epochs: 100
eval_interval: 1
checkpoint_every_eval: False

lr: 1e-4
lr_min_ratio: 0.01
lr_warmup_steps: 100
grad_clip: 1.0

beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.0

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 0.0

seed: 42
min_eval_interval: 0

project_name: "trm-lilavati-multiply"
run_name: "lilavati2_fact_only_trm_d3"

# Lilavati2_fact_only specific: uses single head (lm_head) and single unified loss
# Note: lilavati2_fact_only computes a single unified cross-entropy loss over the entire sequence
# using only lm_head logits (predicts both result and factorization positions with same head)
# Examples without FACT token use unified loss on result positions only (like vanilla)
arch:
  carry_loss_weight: 1.0  # Not used in single-loss mode, but kept for compatibility
